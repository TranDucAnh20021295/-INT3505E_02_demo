openapi: 3.0.0
info:
  title: Library Management API v5
  version: 1.0.0
  description: RESTful API with JWT Authentication, Token Cache, and HTTP Caching

servers:
  - url: http://localhost:5003
    description: Local server

security:
  - BearerAuth: []

paths:
  /register:
    post:
      summary: Register a new user
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: User registered successfully
        '409':
          description: User already exists

  /login:
    post:
      summary: User login
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /books:
    get:
      summary: Get all books
      tags: [Books]
      parameters:
        - name: If-None-Match
          in: header
          description: ETag for conditional requests
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          description: Last-Modified date for conditional requests
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
          headers:
            ETag:
              description: Entity tag for caching
              schema:
                type: string
            Last-Modified:
              description: Last modification date
              schema:
                type: string
                format: date-time
            Cache-Control:
              description: Cache control directive
              schema:
                type: string
        '304':
          description: Not Modified (cached version is valid)
        '401':
          description: Unauthorized

    post:
      summary: Create a new book
      tags: [Books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: Book created successfully
        '401':
          description: Unauthorized

  /books/{id}:
    get:
      summary: Get book by ID
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: If-None-Match
          in: header
          description: ETag for conditional requests
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          description: Last-Modified date for conditional requests
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '304':
          description: Not Modified (cached version is valid)
        '401':
          description: Unauthorized
        '404':
          description: Book not found

    put:
      summary: Update a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Book updated
        '401':
          description: Unauthorized
        '404':
          description: Book not found

    delete:
      summary: Delete a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Book deleted
        '401':
          description: Unauthorized
        '404':
          description: Book not found

  /users:
    get:
      summary: Get all users
      tags: [Users]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /external-api/{api_name}:
    get:
      summary: Call external API with token cache
      tags: [External API]
      parameters:
        - name: api_name
          in: path
          required: true
          description: Name of the external API
          schema:
            type: string
            example: "weather-api"
      responses:
        '200':
          description: External API called successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalApiResponse'
        '401':
          description: Unauthorized

  /loans:
    get:
      summary: Get all loans
      tags: [Loans]
      responses:
        '200':
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Loan'
        '401':
          description: Unauthorized

    post:
      summary: Create a new loan
      tags: [Loans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanCreate'
      responses:
        '201':
          description: Loan created successfully
        '404':
          description: User or book not found
        '409':
          description: Book not available or user already borrowed this book
        '401':
          description: Unauthorized

  /loans/{loan_id}:
    get:
      summary: Get loan by ID
      tags: [Loans]
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Loan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '404':
          description: Loan not found
        '401':
          description: Unauthorized

  /loans/{loan_id}/return:
    put:
      summary: Return a borrowed book
      tags: [Loans]
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnLoan'
      responses:
        '200':
          description: Loan returned successfully
        '400':
          description: Loan not active
        '404':
          description: Loan or book not found
        '401':
          description: Unauthorized

  /borrows:
    get:
      summary: Get all loans (legacy endpoint)
      tags: [Loans]
      responses:
        '200':
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Loan'
        '401':
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        available:
          type: integer
          example: 1

    BookCreate:
      type: object
      required: [title, author]
      properties:
        title:
          type: string
          example: "The Hobbit"
        author:
          type: string
          example: "J.R.R. Tolkien"

    BookUpdate:
      type: object
      properties:
        title:
          type: string
        author:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    UserRegister:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          example: "password123"

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          example: "password123"

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        token:
          type: string
          description: JWT token for authentication
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
        user:
          $ref: '#/components/schemas/User'

    ExternalApiResponse:
      type: object
      properties:
        message:
          type: string
          example: "Called external API weather-api"
        data:
          type: object
          properties:
            api_name:
              type: string
              example: "weather-api"
            token_used:
              type: string
              description: Cached token used for the API call
              example: "external_token_weather-api_1640995200"
            timestamp:
              type: string
              format: date-time
              example: "2024-01-01T12:00:00Z"
            user_id:
              type: integer
              example: 1

    Loan:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        book_id:
          type: integer
        borrow_date:
          type: string
        return_date:
          type: string
        actual_return_date:
          type: string
          nullable: true
        status:
          type: string
          example: borrowed

    LoanCreate:
      type: object
      required: [user_id, book_id, borrow_date, return_date]
      properties:
        user_id:
          type: integer
        book_id:
          type: integer
        borrow_date:
          type: string
        return_date:
          type: string

    ReturnLoan:
      type: object
      required: [actual_return_date]
      properties:
        actual_return_date:
          type: string
