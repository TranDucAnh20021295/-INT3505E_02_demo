openapi: 3.0.0
info:
  title: Library Management API
  version: 1.0.0
  description: RESTful API for managing books, users, and loans

servers:
  - url: http://localhost:5002
    description: Local server

paths:
  /books:
    get:
      summary: Get all books
      tags: [Books]
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

    post:
      summary: Create a new book
      tags: [Books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: Book created successfully
        '400':
          description: Invalid input

  /books/{id}:
    put:
      summary: Update a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Book updated

    delete:
      summary: Delete a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Book deleted

  /users:
    get:
      summary: Get all users
      tags: [Users]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      summary: Create a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created

  /login:
    post:
      summary: User login
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /loans:
    get:
      summary: Get all loans
      tags: [Loans]
      responses:
        '200':
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Loan'

    post:
      summary: Create a new loan
      tags: [Loans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanCreate'
      responses:
        '201':
          description: Loan created
        '404':
          description: User or book not found
        '409':
          description: Book not available

  /loans/{loan_id}:
    get:
      summary: Get loan by ID
      tags: [Loans]
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Loan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '404':
          description: Loan not found

  /loans/{loan_id}/return:
    put:
      summary: Return a borrowed book
      tags: [Loans]
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnLoan'
      responses:
        '200':
          description: Loan returned
        '400':
          description: Loan not active
        '404':
          description: Loan not found

components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        available:
          type: integer
          example: 1

    BookCreate:
      type: object
      required: [title, author]
      properties:
        title:
          type: string
          example: "The Hobbit"
        author:
          type: string
          example: "J.R.R. Tolkien"

    BookUpdate:
      type: object
      properties:
        title:
          type: string
        author:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    UserCreate:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string

    Login:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Loan:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        book_id:
          type: integer
        borrow_date:
          type: string
        return_date:
          type: string
        actual_return_date:
          type: string
          nullable: true
        status:
          type: string
          example: borrowed

    LoanCreate:
      type: object
      required: [user_id, book_id, borrow_date, return_date]
      properties:
        user_id:
          type: integer
        book_id:
          type: integer
        borrow_date:
          type: string
        return_date:
          type: string

    ReturnLoan:
      type: object
      required: [actual_return_date]
      properties:
        actual_return_date:
          type: string
